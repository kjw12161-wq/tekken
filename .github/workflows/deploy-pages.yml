# 정적 사이트를 GitHub Pages 로 배포한다.
# 빌드 과정이 없으므로 저장소 내용을 그대로 업로드한다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/dragonball-fighting-game-site-tg5z95
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만, 진행 중인 배포는 취소하지 않는다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 (없으면 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 사이트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
